    });
  }
  function barQuick(U){
    var r2=U.r2, lab=U.lab, sel=U.sel, numBox=U.numBox, toggle=U.toggle, sep=U.sep;
    lab(r2,'Font',sel(FONTS.map(function(f){return [f[0],f[1]];}),'font','s'));
    numBox(r2,'Text','size',8,40);
    if(HASTITLE)numBox(r2,'Title','tsize',8,60);
    numBox(r2,'Corners','radius',0,40);
    sep(r2);
    if(CANFLEX){
      U.flexSeg(r2,'Keeps its size: a smaller box shows less room for the drawing',
        'Text and drawing grow and shrink with the box; the title keeps its size. The size it has now counts as normal');
      sep(r2);
    }
    if(HASTITLE)toggle(r2,'Title','showTitle','Show the title');
    if(typeof typeQuick==='function')typeQuick(U);
  }

  /* the Tiles menu, as in Map Studio's floating bar */
  var SLABELS=[['up','Up'],['warning','Warning'],['down','Down'],['ack','Down (acknowledged)'],['paused','Paused'],['unusual','Unusual'],
    ['unknown','Unknown'],['total','Total'],['pctup','Percent up']];
  function typeMenus(U){
    U.menu(U.r1,'Tiles',function(pop){
      var E=U.E, d=U.d;
      U.pop=pop;U.note(pop,'Which counts to show (keep at least one).');
      var g=el('div','cols2');pop.appendChild(g);
      SLABELS.forEach(function(s){
        var w=el('label','pc','<input type="checkbox"><span>'+esc(s[1])+'</span>'), c=w.querySelector('input');
        c.addEventListener('change',function(){
          var t=(E().tiles||[]).slice(), at=t.indexOf(s[0]);
          if(c.checked&&at< 0)t.push(s[0]);
          else if(!c.checked&&at>-1){if(t.length< 2){c.checked=true;return;}t.splice(at,1);}
          d.tiles=t;U.change();U.sync();
        });
        U.syncs.push(function(){c.checked=(E().tiles||[]).indexOf(s[0])>-1;});g.appendChild(w);
      });
      U.pfSeg(pop,'Caption under the number',[['of','of N sensors'],['none','None']],'cap');
      U.pfCheck(pop,'Grey out the states that have none','quiet');
      U.pfSelect(pop,'Box height',[['','Fill the object'],['small','Small (64 px)'],['medium','Medium (96 px)'],['large','Large (140 px)']],'boxH');
    });
  }
  /* ---------- start: draw with the saved settings, then the gear (not in PRTG's Map Designer or its hover preview) ---------- */
  R.apply=apply;R.openFn=openBar;
  apply(R.open&&R.draft?R.draft:savedRaw());
  if(typeof onMutate==='function'&&window.MutationObserver){
    var mq=false, mo=new MutationObserver(function(){
      if(mq)return;mq=true;
      setTimeout(function(){mq=false;if(!document.documentElement.contains(root)){mo.disconnect();return;}onMutate();},300);
    });
    mo.observe(root,{childList:true,subtree:true});
  }
  if(inPreview()||inDesigner())return;
  if(isPublic()&&!readShared().publicGear)return;
  var g=el('button','mst-gear',GEAR,document);g.type='button';g.title='Change how this '+NOUN+' looks';g.setAttribute('aria-label','Change how this '+NOUN+' looks');
  ['mousedown','dblclick'].forEach(function(ev){g.addEventListener(ev,function(e){e.stopPropagation();});});
  g.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(barHost()){closeBar(false);apply(savedRaw());}else openBar();});
  root.appendChild(g);
  if(R.open&&R.size)sizeApply();
  if(R.open&&!barHost())openBar();
  else if(R.open){root.classList.add('mst-open');if(!isPublic())selShow();}
})();
</script>
